# =============================================================================
# Dependabot — grupperade, månatliga beroendeuppdateringar
# Govtech4all Pilot 3 (Sundsvalls kommun, UH-2026-159)
#
# Ska-krav #36/#49 uppfylls av pip-audit + gitleaks + CodeQL i CI och av
# Dependabot *security updates* (aktiveras i repo-inställningar, oberoende av
# denna fil). Denna fil styr enbart rutinmässiga *versions*-uppdateringar och
# är avsiktligt lågmäld för att inte spamma PR-flödet:
#
#   * EN grupperad PR per ekosystem (patterns "*", alla update-types)
#   * månadsvis i stället för veckovis
#   * högst 1 öppen PR åt gången per post
#
# Nödstopp: sätt open-pull-requests-limit: 0 på en post för att stänga av dess
# versions-PR:er helt (säkerhetsuppdateringar fortsätter ändå).
# =============================================================================
version: 2

updates:
  # --- Python per tjänst (pip / requirements.txt) ---------------------------
  - package-ecosystem: "pip"
    directory: "/services/mcp"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "service:mcp"]
    groups:
      mcp-python:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/services/viewer"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "service:viewer"]
    groups:
      viewer-python:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/services/worker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "service:worker"]
    groups:
      worker-python:
        patterns: ["*"]

  # --- segmenter (uv) --------------------------------------------------------
  - package-ecosystem: "uv"
    directory: "/services/segmenter"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "service:segmenter"]
    groups:
      segmenter-python:
        patterns: ["*"]

  # --- Docker-basavbilder (en grupperad PR för alla Dockerfiles) ------------
  - package-ecosystem: "docker"
    directories:
      - "/db"
      - "/services/mcp"
      - "/services/viewer"
      - "/services/worker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "docker"]
    groups:
      docker-base-images:
        patterns: ["*"]

  # --- GitHub Actions-versioner ---------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]
