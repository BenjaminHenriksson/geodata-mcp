{{/*
Postgres — stateful PostGIS 17 + pgvector + pg_trgm + pgaudit.
Custom image built from db/Dockerfile. StatefulSet with a persistent
volumeClaimTemplate (the "PVC"); a headless + a regular ClusterIP Service.
The DB is never exposed outside the cluster — app services reach it in-cluster.
*/}}
{{- $fullName := include "geodata-mcp.fullname" . -}}
{{- $svcName := include "geodata-mcp.postgresHost" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "geodata-mcp.componentSelectorLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-headless" $svcName }}
  labels:
    {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "geodata-mcp.componentSelectorLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ printf "%s-headless" $svcName }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "geodata-mcp.componentSelectorLabels" (dict "root" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "postgres") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "geodata-mcp.serviceAccountName" . }}
      {{- include "geodata-mcp.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "geodata-mcp.image" (dict "svc" .Values.postgres "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- toYaml .Values.postgres.args | nindent 12 }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.service.port }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "geodata-mcp.configMapName" . }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "geodata-mcp.configMapName" . }}
                  key: POSTGRES_USER
            # Keep pgdata in a subdirectory so the volume root (which may carry a
            # lost+found on some storage classes) is not used as PGDATA.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geodata-mcp.secretName" . }}
                  key: POSTGRES_PASSWORD
            # Consumed by db/init/02_roles.sh on first initialization only.
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geodata-mcp.secretName" . }}
                  key: APP_DB_PASSWORD
            - name: AGENT_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geodata-mcp.secretName" . }}
                  key: AGENT_RO_PASSWORD
            - name: AGENT_WS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geodata-mcp.secretName" . }}
                  key: AGENT_WS_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            {{- if .Values.postgres.initScriptsConfigMap }}
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            {{- end }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      {{- if .Values.postgres.initScriptsConfigMap }}
      volumes:
        - name: initdb
          configMap:
            name: {{ .Values.postgres.initScriptsConfigMap }}
            defaultMode: 0555
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "postgres") | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.postgres.persistence.accessMode }}
        {{- if .Values.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size | quote }}
