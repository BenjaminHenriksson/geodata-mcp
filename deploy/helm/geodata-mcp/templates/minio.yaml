{{/*
MinIO — S3-compatible object store for the `exports` bucket. Stateful, but a
single-replica Deployment with a dedicated PVC and the Recreate strategy (RWO
volume, single writer). The worker creates the bucket on startup.
*/}}
{{- $svcName := include "geodata-mcp.minioHost" . -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-data" $svcName }}
  labels:
    {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "minio") | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.minio.persistence.accessMode }}
  {{- if .Values.minio.persistence.storageClass }}
  storageClassName: {{ .Values.minio.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "minio") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: api
      port: {{ .Values.minio.service.apiPort }}
      targetPort: api
      protocol: TCP
    - name: console
      port: {{ .Values.minio.service.consolePort }}
      targetPort: console
      protocol: TCP
  selector:
    {{- include "geodata-mcp.componentSelectorLabels" (dict "root" $ "component" "minio") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "minio") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "geodata-mcp.componentSelectorLabels" (dict "root" $ "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "minio") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "geodata-mcp.serviceAccountName" . }}
      {{- include "geodata-mcp.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minio
          image: {{ include "geodata-mcp.image" (dict "svc" .Values.minio "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - server
            - /data
            - --console-address
            - {{ .Values.minio.consoleAddress | quote }}
          ports:
            - name: api
              containerPort: {{ .Values.minio.service.apiPort }}
              protocol: TCP
            - name: console
              containerPort: {{ .Values.minio.service.consolePort }}
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "geodata-mcp.secretName" . }}
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geodata-mcp.secretName" . }}
                  key: MINIO_ROOT_PASSWORD
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ printf "%s-data" $svcName }}
