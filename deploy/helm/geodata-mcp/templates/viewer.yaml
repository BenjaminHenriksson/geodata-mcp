{{/*
Viewer — map pages (MapLibre + Origo), data/tiles endpoints, workspace-manager
UI, authenticated-WMS relay (uvicorn, 3 workers, on :8001). Stateless per request
→ scales horizontally with a RollingUpdate.
*/}}
{{- $svcName := include "geodata-mcp.viewerHost" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "viewer") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.viewer.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "geodata-mcp.componentSelectorLabels" (dict "root" $ "component" "viewer") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "viewer") | nindent 4 }}
spec:
  replicas: {{ .Values.viewer.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "geodata-mcp.componentSelectorLabels" (dict "root" $ "component" "viewer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "viewer") | nindent 8 }}
      {{- if .Values.metrics.enabled }}
      annotations:
        {{- include "geodata-mcp.metricsAnnotations" (dict "root" $ "port" .Values.viewer.service.port) | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "geodata-mcp.serviceAccountName" . }}
      {{- include "geodata-mcp.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: viewer
          image: {{ include "geodata-mcp.image" (dict "svc" .Values.viewer "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.viewer.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "geodata-mcp.configMapName" . }}
            - secretRef:
                name: {{ include "geodata-mcp.secretName" . }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.viewer.resources | nindent 12 }}
