{{/*
Application Secret — credentials only.

IMPORTANT (ska-krav #59): in production the REAL secrets come from the buyer's
OpenShift Secrets, NOT from this chart. Set `secrets.existingSecret: <name>` to
reference a Secret the buyer manages out-of-band; this template then renders
nothing. The keys the buyer's Secret must provide are exactly the keys below,
including the assembled DATABASE_URL_APP / DATABASE_URL_RO / DATABASE_URL_WS
(postgresql://<role>:<password>@<postgres-service>:5432/<db>).

When `secrets.create: true` (dev/CI only) the placeholder values from values.yaml
are used — never commit real passwords into values.yaml.
*/}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) -}}
{{- $pgHost := include "geodata-mcp.postgresHost" . -}}
{{- $pgPort := int .Values.postgres.service.port -}}
{{- $db := .Values.config.postgresDb -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secret" (include "geodata-mcp.fullname" .) }}
  labels:
    {{- include "geodata-mcp.componentLabels" (dict "root" $ "component" "secret") | nindent 4 }}
type: Opaque
stringData:
  # Postgres superuser + application-role passwords (db/init/02_roles.sh reads the
  # role passwords on first initialization).
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  APP_DB_PASSWORD: {{ .Values.secrets.appDbPassword | quote }}
  AGENT_RO_PASSWORD: {{ .Values.secrets.agentRoPassword | quote }}
  AGENT_WS_PASSWORD: {{ .Values.secrets.agentWsPassword | quote }}
  # Assembled connection URLs (contain the passwords, hence secret). Roles:
  # geodata_app (services), agent_ro (SELECT-only agent SQL), agent_ws (write path).
  DATABASE_URL_APP: {{ printf "postgresql://geodata_app:%s@%s:%d/%s" .Values.secrets.appDbPassword $pgHost $pgPort $db | quote }}
  DATABASE_URL_RO: {{ printf "postgresql://agent_ro:%s@%s:%d/%s" .Values.secrets.agentRoPassword $pgHost $pgPort $db | quote }}
  DATABASE_URL_WS: {{ printf "postgresql://agent_ws:%s@%s:%d/%s" .Values.secrets.agentWsPassword $pgHost $pgPort $db | quote }}
  # Object store root credentials.
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
  # MCP bearer auth (comma-separated raw keys; hashed at startup). Not optional.
  GEODATA_API_KEYS: {{ .Values.secrets.geodataApiKeys | quote }}
  # OAuth browser-login invite code (empty disables OAuth).
  GEODATA_INVITE_CODE: {{ .Values.secrets.geodataInviteCode | quote }}
  # Signs the viewer workspace-manager login cookie.
  VIEWER_SECRET: {{ .Values.secrets.viewerSecret | quote }}
  # Basic/per-host auth for authenticated upstream sources (worker + viewer).
  LANTMATERIET_CREDENTIALS: {{ .Values.secrets.lantmaterietCredentials | quote }}
  GEODATA_HTTP_CREDENTIALS: {{ .Values.secrets.geodataHttpCredentials | quote }}
{{- end -}}
