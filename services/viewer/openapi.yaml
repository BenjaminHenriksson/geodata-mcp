# Geodata MCP - Viewer & Data API (OpenAPI 3.0.3)
# Curated, hand-maintained spec. FastAPI's own schema is regenerated by
# scripts/dump_openapi.py -> services/viewer/openapi.json.
# Licence: AGPL-3.0-only.
openapi: "3.0.3"
info:
  title: "Geodata MCP – Viewer & Data API"
  version: "0.1.0"
  description: |-
    Open HTTP-gränssnitt (öppet REST-API) för Geodata MCP – den PostGIS-baserade kommunala geodataplattformen som levereras inom Sundsvalls kommuns upphandling UH-2026-159 (Govtech4all Pilot 3 – AI och geodata). Detta dokument beskriver *viewer- och datatjänsten*: kart-vyer, stilar, GeoJSON- och vektor-tile-utdata (MVT), WMS-proxy samt den inloggningsskyddade arbetsyte-hanteraren. Kontrollplanet (MCP-verktygen) körs som en separat tjänst på samma origin under /mcp och beskrivs kort nedan.

    ## Versionshantering och bakåtkompatibilitet (ska-krav #16)

    API:et är versionshanterat: `info.version` anger utgåvan och kart-vyer nås via stabila capability-URL:er `/v/{view_id}`. Inom en major-version är ändringar additiva och bakåtkompatibla. En publicerad API-version stöds i minst 12 månader efter att en efterföljande version har släppts, så att befintliga integrationer fortsätter fungera utan ändring under minst ett år.

    The API is versioned. Within a major version, changes are additive and backward-compatible, and any released version is supported for at least 12 months after a successor is published, so existing integrations keep working for at least one year.

    ## Inga avgifter per anrop eller volym (ska-krav #18, #19)

    Samtliga API- och fil-/datagränssnitt (GeoJSON, MVT-tiles, WMS-proxy samt export till GPKG/GeoJSON/CSV/Parquet via kontrollplanet) tillhandahålls utan någon avgift per anrop, per transaktion eller per datavolym för offentlig sektor. Det finns inga mätare, betalkvoter eller volymbaserad debitering på något gränssnitt.

    All API and file/data interfaces are free of any per-call, per-transaction or per-volume charge for public-sector users. No interface is metered or billed by usage.

    ## Åtkomstmodell

    Kart- och datauttag (`/v`, `/data`, `/tiles`, `/wmsref`) skyddas med icke gissningsbara capability-URL:er: ett giltigt `view_id` krävs och det efterfrågade lagret måste ingå i den namngivna vyn (annars 403) – inga API-nycklar skickas av kartklienten. Arbetsyte-hanteraren (`/workspaces`) använder en signerad, HttpOnly-sessionscookie som utfärdas mot API-nyckeln vid inloggning. Kontrollplanet /mcp kräver `Authorization: Bearer <API-nyckel>` och skyddas dessutom av OAuth2 (authorization code + PKCE, se services/mcp/oauth.py; discovery på /.well-known/oauth-*).

    ## Licens

    Programvaran och detta gränssnitt distribueras under AGPL-3.0-only.
  contact:
    name: "Geodata MCP – Govtech4all Pilot 3 (Sundsvalls kommun UH-2026-159)"
    url: "https://www.sundsvall.se"
    email: "abenjaminhenriksson@gmail.com"
  license:
    name: "AGPL-3.0-only"
    url: "https://www.gnu.org/licenses/agpl-3.0.html"
externalDocs:
  description: "Architecture and implementation contracts (README.md, geodata-mcp-architecture.md, CONTRACTS.md)."
  url: "https://www.sundsvall.se"
servers:
  - url: "http://localhost:8080"
    description: "Local docker compose deployment (Caddy front proxy)."
  - url: "{baseUrl}"
    description: "Deployed instance; operators set PUBLIC_BASE_URL."
    variables:
      baseUrl:
        default: "http://localhost:8080"
        description: "Public base URL of the deployment."
tags:
  - name: "health"
    description: "Liveness."
  - name: "map"
    description: "Map views, styles and page rendering."
  - name: "data"
    description: "Open geodata: GeoJSON and Mapbox Vector Tiles, capability-scoped."
  - name: "proxy"
    description: "Server-side WMS GetMap proxy for authenticated raster sources."
  - name: "manager"
    description: "Cookie-authenticated workspace manager UI."
  - name: "static"
    description: "Bundled static assets."
security: []
paths:
  "/healthz":
    get:
      tags:
        - "health"
      summary: "Liveness probe"
      description: "Returns a small JSON object; used by the container healthcheck."
      operationId: "healthz"
      security: []
      responses:
        "200":
          description: "Service is up."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
              example:
                ok: true
  "/":
    get:
      tags:
        - "manager"
      summary: "Root redirect"
      description: "Redirects to the workspace manager at /workspaces."
      operationId: "index"
      security: []
      responses:
        "302":
          description: "Redirect to /workspaces."
          headers:
            Location:
              description: "Always /workspaces."
              schema:
                type: "string"
  "/login":
    get:
      tags:
        - "manager"
      summary: "Login form"
      description: "HTML sign-in form for the workspace manager. Requires the manager to be enabled (VIEWER_SECRET set)."
      operationId: "login_form"
      security: []
      responses:
        "200":
          description: "Login page."
          content:
            "text/html":
              schema:
                type: "string"
        "503":
          description: "Workspace manager disabled (VIEWER_SECRET not set)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      tags:
        - "manager"
      summary: "Sign in"
      description: "Verifies the API key's hash against app.api_keys and, on success, sets a signed HttpOnly session cookie (gdw_auth) and redirects to /workspaces. The raw key is never stored in the cookie."
      operationId: "login"
      security: []
      requestBody:
        required: true
        content:
          "application/x-www-form-urlencoded":
            schema:
              type: "object"
              properties:
                key:
                  type: "string"
                  description: "The API key (same key used as the /mcp bearer token)."
      responses:
        "303":
          description: "Signed in; redirect to /workspaces (Set-Cookie: gdw_auth)."
          headers:
            Location:
              schema:
                type: "string"
            "Set-Cookie":
              description: "Signed HttpOnly session cookie."
              schema:
                type: "string"
        "401":
          description: "Unknown or disabled API key (login page re-rendered)."
          content:
            "text/html":
              schema:
                type: "string"
        "503":
          description: "Workspace manager disabled (VIEWER_SECRET not set)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/logout":
    post:
      tags:
        - "manager"
      summary: "Sign out"
      description: "Clears the session cookie and redirects to /login."
      operationId: "logout"
      security:
        - managerCookie: []
      responses:
        "303":
          description: "Signed out; redirect to /login (cookie deleted)."
          headers:
            Location:
              schema:
                type: "string"
  "/workspaces":
    get:
      tags:
        - "manager"
      summary: "Workspace manager UI"
      description: "HTML page listing the signed-in key's durable workspaces (layer and map counts, activate/rename/delete controls). Redirects to /login when no valid session cookie is present."
      operationId: "workspaces"
      security:
        - managerCookie: []
      responses:
        "200":
          description: "Manager page."
          content:
            "text/html":
              schema:
                type: "string"
        "302":
          description: "Not signed in; redirect to /login."
          headers:
            Location:
              schema:
                type: "string"
        "503":
          description: "Workspace manager disabled (VIEWER_SECRET not set)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/workspaces/action":
    post:
      tags:
        - "manager"
      summary: "Workspace action (activate / rename / delete)"
      description: "CSRF-protected form action operating on a workspace owned by the signed-in key. `action` is one of activate, rename or delete; `new_name` is required for rename (^[a-z0-9][a-z0-9_-]{0,39}$)."
      operationId: "workspaces_action"
      security:
        - managerCookie: []
      requestBody:
        required: true
        content:
          "application/x-www-form-urlencoded":
            schema:
              type: "object"
              required:
                - "action"
                - "workspace_id"
                - "csrf"
              properties:
                action:
                  type: "string"
                  enum:
                    - "activate"
                    - "rename"
                    - "delete"
                workspace_id:
                  type: "string"
                  format: "uuid"
                new_name:
                  type: "string"
                  description: "New name (required for rename)."
                csrf:
                  type: "string"
                  description: "Per-principal CSRF token from the form."
      responses:
        "303":
          description: "Action applied; redirect to /workspaces."
          headers:
            Location:
              schema:
                type: "string"
        "302":
          description: "Not signed in; redirect to /login."
          headers:
            Location:
              schema:
                type: "string"
        "400":
          description: "Invalid request (unknown workspace/action or bad name); manager page re-rendered with the error."
          content:
            "text/html":
              schema:
                type: "string"
        "403":
          description: "Bad CSRF token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: "Workspace manager disabled (VIEWER_SECRET not set)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v/{view_id}/style.json":
    get:
      tags:
        - "map"
      summary: "MapLibre style document"
      description: "Compiled MapLibre GL style (version 8) for the view. Supports conditional GET: the weak ETag covers the view version, the dependent layer_meta rows and the compiler version, so open pages poll with If-None-Match for near-live updates."
      operationId: "style_json"
      security: []
      parameters:
        - name: "view_id"
          in: "path"
          required: true
          description: "Capability id of the map view (^v_[a-f0-9]{24}$)."
          schema:
            type: "string"
            pattern: "^v_[a-f0-9]{24}$"
        - name: "If-None-Match"
          in: "header"
          required: false
          description: "Previously returned ETag; a match yields 304."
          schema:
            type: "string"
      responses:
        "200":
          description: "MapLibre style JSON."
          headers:
            ETag:
              schema:
                type: "string"
            "Cache-Control":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MapLibreStyle"
        "304":
          description: "Not modified (ETag matched)."
          headers:
            ETag:
              schema:
                type: "string"
        "404":
          description: "Unknown view."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v/{view_id}/origo.json":
    get:
      tags:
        - "map"
      summary: "Origo/OpenLayers configuration"
      description: "Renderer-agnostic view compiled to an Origo (OpenLayers) config."
      operationId: "origo_json"
      security: []
      parameters:
        - name: "view_id"
          in: "path"
          required: true
          description: "Capability id of the map view (^v_[a-f0-9]{24}$)."
          schema:
            type: "string"
            pattern: "^v_[a-f0-9]{24}$"
      responses:
        "200":
          description: "Origo configuration JSON."
          headers:
            "Cache-Control":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OrigoConfig"
        "404":
          description: "Unknown view."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v/{view_id}":
    get:
      tags:
        - "map"
      summary: "Interactive map page"
      description: "HTML map page for the view. `renderer=maplibre` (default) serves the MapLibre GL page; `renderer=origo` serves the Origo/OpenLayers page. Each page links to the other."
      operationId: "view_page"
      security: []
      parameters:
        - name: "view_id"
          in: "path"
          required: true
          description: "Capability id of the map view (^v_[a-f0-9]{24}$)."
          schema:
            type: "string"
            pattern: "^v_[a-f0-9]{24}$"
        - name: "renderer"
          in: "query"
          required: false
          description: "Map renderer to serve."
          schema:
            type: "string"
            enum:
              - "maplibre"
              - "origo"
            default: "maplibre"
      responses:
        "200":
          description: "Map page."
          content:
            "text/html":
              schema:
                type: "string"
        "400":
          description: "renderer must be 'maplibre' or 'origo'."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Unknown view."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/data/{layer}.geojson":
    get:
      tags:
        - "data"
      summary: "Layer as GeoJSON"
      description: "A GeoJSON FeatureCollection for the layer, capability-checked against the named view. Geometries over the simplify threshold are simplified server-side; a 15 s statement timeout applies."
      operationId: "data_geojson"
      security: []
      parameters:
        - name: "layer"
          in: "path"
          required: true
          description: "Vector layer reference schema.table, e.g. ref.byggnader or ws_1a2b3c4d.mylayer."
          schema:
            type: "string"
            pattern: "^(ref|ws_[a-f0-9]{8})\\.[a-z0-9_]{1,63}$"
        - name: "view"
          in: "query"
          required: false
          description: "Capability id of the view that grants access to this layer. Required in practice: the request returns 400 if omitted and 403 if the layer is not part of the view."
          schema:
            type: "string"
            pattern: "^v_[a-f0-9]{24}$"
        - name: "crs"
          in: "query"
          required: false
          description: "Output CRS: 4326 (WGS84 lon/lat) or 3014 (SWEREF 99 17 15)."
          schema:
            type: "integer"
            enum:
              - 4326
              - 3014
            default: 4326
        - name: "limit"
          in: "query"
          required: false
          description: "Max features (clamped to 1..50000)."
          schema:
            type: "integer"
            default: 20000
            minimum: 1
            maximum: 50000
      responses:
        "200":
          description: "GeoJSON FeatureCollection."
          headers:
            "Cache-Control":
              schema:
                type: "string"
          content:
            "application/geo+json":
              schema:
                "$ref": "#/components/schemas/FeatureCollection"
        "400":
          description: "Bad crs, missing view, or layer has no geom column."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "Unknown view, or layer is not part of the view."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Unknown layer ref, or layer table not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/tiles/{layer}/{z}/{x}/{y}.mvt":
    get:
      tags:
        - "data"
      summary: "Mapbox Vector Tile"
      description: "A single Mapbox Vector Tile (MVT) for the layer at z/x/y, capability-checked against the named view. Empty tiles return 204."
      operationId: "tiles_mvt"
      security: []
      parameters:
        - name: "layer"
          in: "path"
          required: true
          description: "Vector layer reference schema.table, e.g. ref.byggnader or ws_1a2b3c4d.mylayer."
          schema:
            type: "string"
            pattern: "^(ref|ws_[a-f0-9]{8})\\.[a-z0-9_]{1,63}$"
        - name: "z"
          in: "path"
          required: true
          description: "Zoom (0..22)."
          schema:
            type: "integer"
            minimum: 0
            maximum: 22
        - name: "x"
          in: "path"
          required: true
          description: "Tile column (0..2^z-1)."
          schema:
            type: "integer"
            minimum: 0
        - name: "y"
          in: "path"
          required: true
          description: "Tile row (0..2^z-1)."
          schema:
            type: "integer"
            minimum: 0
        - name: "view"
          in: "query"
          required: false
          description: "Capability id of the view that grants access to this layer. Required in practice: the request returns 400 if omitted and 403 if the layer is not part of the view."
          schema:
            type: "string"
            pattern: "^v_[a-f0-9]{24}$"
      responses:
        "200":
          description: "MVT tile."
          headers:
            "Cache-Control":
              schema:
                type: "string"
          content:
            "application/vnd.mapbox-vector-tile":
              schema:
                type: "string"
                format: "binary"
        "204":
          description: "Empty tile (no features in range)."
        "400":
          description: "Tile coordinates out of range, missing view, or no geom."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "Unknown view, or layer is not part of the view."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Unknown layer ref, or layer table not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/wmsref/{dataset_id}":
    get:
      tags:
        - "proxy"
      summary: "Authenticated WMS GetMap proxy"
      description: "Server-side GetMap proxy for authenticated WMS raster_refs: the browser cannot hold the upstream Basic-auth credential, so map sources point here and the viewer injects it. Capability-checked: the dataset's wms: reference must be part of the named view, and only REQUEST=GetMap is proxied. All standard WMS GetMap KVP parameters (SERVICE, VERSION, LAYERS, STYLES, CRS/SRS, BBOX, WIDTH, HEIGHT, FORMAT, TRANSPARENT, ...) are forwarded upstream; only `view` is stripped."
      operationId: "wmsref"
      security: []
      parameters:
        - name: "dataset_id"
          in: "path"
          required: true
          description: "Catalog dataset UUID of the raster_ref."
          schema:
            type: "string"
            format: "uuid"
        - name: "view"
          in: "query"
          required: false
          description: "Capability id of the view that grants access to this layer. Required in practice: the request returns 400 if omitted and 403 if the layer is not part of the view."
          schema:
            type: "string"
            pattern: "^v_[a-f0-9]{24}$"
        - name: "REQUEST"
          in: "query"
          required: true
          description: "Must be GetMap (case-insensitive); anything else is refused."
          schema:
            type: "string"
            enum:
              - "GetMap"
        - name: "LAYERS"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "BBOX"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "WIDTH"
          in: "query"
          required: false
          schema:
            type: "integer"
        - name: "HEIGHT"
          in: "query"
          required: false
          schema:
            type: "integer"
        - name: "CRS"
          in: "query"
          required: false
          description: "Or SRS for WMS 1.1.1."
          schema:
            type: "string"
        - name: "FORMAT"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "image/png"
      responses:
        "200":
          description: "Upstream WMS image (content type passed through)."
          headers:
            "Cache-Control":
              schema:
                type: "string"
          content:
            "image/png":
              schema:
                type: "string"
                format: "binary"
            "image/jpeg":
              schema:
                type: "string"
                format: "binary"
        "400":
          description: "Missing view query parameter."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "Layer not part of the view, or non-GetMap request."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Unknown dataset."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "Upstream WMS request failed or returned non-200."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/static/{path}":
    get:
      tags:
        - "static"
      summary: "Static asset"
      description: "Serves bundled static files (fonts, sprites, JS/CSS) used by the map pages, mounted from the service's static directory."
      operationId: "static_files"
      security: []
      parameters:
        - name: "path"
          in: "path"
          required: true
          description: "Relative path of the asset."
          schema:
            type: "string"
      responses:
        "200":
          description: "Asset bytes."
          content:
            "application/octet-stream":
              schema:
                type: "string"
                format: "binary"
        "404":
          description: "Asset not found."
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      description: "API key presented as a Bearer token. This is the credential for the MCP control plane (POST /mcp, a separate service on the same origin) and for exchanging into a manager session at POST /login. The open viewer/data endpoints do not require it — they use capability URLs."
    oauth2:
      type: "oauth2"
      description: "The MCP control plane (/mcp) is additionally protected by OAuth2 (see services/mcp/oauth.py; discovery at /.well-known/oauth-authorization-server). Not required for any viewer/data endpoint documented here."
      flows:
        authorizationCode:
          authorizationUrl: "/oauth/authorize"
          tokenUrl: "/oauth/token"
          scopes: {}
    managerCookie:
      type: "apiKey"
      in: "cookie"
      name: "gdw_auth"
      description: "Signed HttpOnly session cookie issued by POST /login; carries only the api_key id, never the key."
  schemas:
    Health:
      type: "object"
      properties:
        ok:
          type: "boolean"
      required:
        - "ok"
    Error:
      type: "object"
      description: "FastAPI error envelope."
      properties:
        detail:
          type: "string"
      required:
        - "detail"
      example:
        detail: "unknown view"
    FeatureCollection:
      type: "object"
      description: "RFC 7946 GeoJSON FeatureCollection."
      required:
        - "type"
        - "features"
      properties:
        type:
          type: "string"
          enum:
            - "FeatureCollection"
        features:
          type: "array"
          items:
            "$ref": "#/components/schemas/Feature"
    Feature:
      type: "object"
      required:
        - "type"
        - "geometry"
        - "properties"
      properties:
        type:
          type: "string"
          enum:
            - "Feature"
        geometry:
          type: "object"
          description: "GeoJSON geometry object."
          additionalProperties: true
        properties:
          type: "object"
          nullable: true
          additionalProperties: true
    MapLibreStyle:
      type: "object"
      description: "MapLibre GL style specification (version 8)."
      additionalProperties: true
    OrigoConfig:
      type: "object"
      description: "Origo/OpenLayers viewer configuration."
      additionalProperties: true
